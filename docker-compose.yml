version: '3.8'

# 环境变量配置说明：
# 1. docker-compose 会自动加载同目录的 .env 文件（如果存在）
# 2. 首次部署时，deploy.sh 会自动从 .env.example 复制
# 3. 也可以手动创建 .env 文件或通过 docker-compose --env-file 指定

services:
  ecloud-web:
    build:
      context: .
      dockerfile: Dockerfile.web
    container_name: ecloud-web
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-8088}:8088"
    volumes:
      # SQLite 数据库持久化
      - ./data:/app/data
      # 可选：挂载配置文件
      - ./data/config.yml:/app/config.yml:ro
    environment:
      - TZ=${TZ:-Asia/Shanghai}
      - LOG_LEVEL=${LOG_LEVEL:-info}
      # 管理员账号配置（首次启动时使用）
      - ADMIN_USERNAME=${ADMIN_USERNAME:-admin}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD}
    networks:
      - ecloud-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8088/health"]
      interval: 30s
      timeout: 3s
      start_period: 10s
      retries: 3
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

networks:
  ecloud-network:
    driver: bridge

